<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Byre app icon: a barn roof and hayloft window over two rows of data with status lights. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA2FF"/>
      <stop offset="1" stop-color="#0A6AE8"/>
    </linearGradient>
    <mask id="lights" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="73" cy="64" r="3.6" fill="#000"/>
      <circle cx="61" cy="83" r="3.6" fill="#000"/>
    </mask>
  </defs>
  <rect x="112" y="112" width="800" height="800" rx="180" fill="url(#bg)"/>
  <g transform="translate(256 240) scale(5.12)">
    <path d="M13 50 L50 19 L87 50" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="43" r="6.5" fill="#FFFFFF"/>
    <g mask="url(#lights)">
      <rect x="30" y="57" width="52" height="14" rx="7" fill="#FFFFFF"/>
      <rect x="18" y="76" width="52" height="14" rx="7" fill="#B9DCFF"/>
    </g>
  </g>
</svg>
